name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-concern:
    name: check-${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: web, file: .devcontainer/Dockerfile, target: check-web }
          - { check: target, file: .devcontainer/Dockerfile, target: check-target }
          - { check: docs, file: .devcontainer/Dockerfile, target: check-docs }
          # The app's own image builds.
          - { check: image, file: Dockerfile, target: "" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target || matrix.file }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          outputs: type=cacheonly
          # One scope per job: jobs writing the same scope would overwrite each other's cache.
          cache-from: type=gha,scope=${{ matrix.check }}
          cache-to: type=gha,scope=${{ matrix.check }},mode=max

  # The one required status check. A job skipped because a need failed would count as passed, so
  # this one always runs and fails on its own.
  check:
    needs: check-concern
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check-concern.result }}" = success
